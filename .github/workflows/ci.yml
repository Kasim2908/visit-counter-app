name: visit-counter-app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: mohammadkasim/visit-counter-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks secret scan
        uses: step-security/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: latest

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: mohammadkasim
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build Docker image
        run: docker build -t $IMAGE_NAME:v${{ github.run_number }} .

      - name: Run Docker container
        run: docker run -d -p 3000:3000 --name visit-counter-app-container $IMAGE_NAME:v${{ github.run_number }}

      - name: Wait for application
        run: sleep 5

      - name: Test application
        run: curl -f http://localhost:3000/health

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}:v${{ github.run_number }}
          format: table
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: '0'

      - name: Push Docker image
        if: github.event_name == 'push'
        run: docker push $IMAGE_NAME:v${{ github.run_number }}

      - name: Stop and remove container
        if: always()
        run: docker rm -f visit-counter-app-container || true