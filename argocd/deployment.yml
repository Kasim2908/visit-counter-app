# argocd/visit-counter-app.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: visit-counter-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mohammadkasim/visit-counter-app.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true